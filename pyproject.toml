[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figmabridge"
version = "0.1.0"
description = "Figma JSON to ScreenCraft importer"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
figmabridge = "figmabridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
